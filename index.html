<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Photo Booth</title>
    <!-- โหลด Tailwind CSS สำหรับตกแต่ง -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Icon -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- โหลด Google Font แบบน่ารักๆ -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Mali', cursive, sans-serif;
        }

        /* อนิเมชันแฟลชตอนถ่ายรูป */
        @keyframes flashEffect {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .flash-active {
            animation: flashEffect 0.5s ease-out;
        }

        /* กลับซ้ายขวาให้เหมือนส่องกระจก */
        .mirror {
            transform: scaleX(-1);
        }

        /* สไตล์สำหรับกรอบ Photo Booth */
        .photo-strip-frame {
            background-color: #e0f2fe;
            box-shadow: 0 15px 35px -5px rgba(56, 189, 248, 0.6);
        }

        /* ปุ่มน่ารักๆ */
        .cute-btn {
            box-shadow: 0 8px 0 #0284c7;
        }

        .cute-btn:hover {
            box-shadow: 0 4px 0 #0284c7;
            transform: translateY(4px);
        }

        .cute-btn:active {
            box-shadow: 0 0px 0 #0284c7;
            transform: translateY(8px);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 overflow-x-hidden relative"
    style="background-color: #f0f9ff; background-image: radial-gradient(#bae6fd 3px, transparent 3px); background-size: 40px 40px;">

    <!-- ของตกแต่งลอยไปมา -->
    <div class="fixed top-10 left-10 animate-pulse drop-shadow-md z-0" style="font-size: 3rem; animation-duration: 2s;">
        ✨</div>
    <div class="fixed bottom-20 left-10 animate-bounce drop-shadow-md z-0"
        style="animation-duration: 3s; font-size: 4rem;">👻</div>
    <div class="fixed top-20 right-20 animate-bounce drop-shadow-md z-0"
        style="animation-duration: 4s; font-size: 3.5rem;">❄️</div>
    <div class="fixed bottom-10 right-10 drop-shadow-md z-0" style="font-size: 4.5rem; transform: rotate(15deg);">💎
    </div>

    <div
        class="bg-white rounded-[40px] shadow-2xl w-full max-w-md border-[6px] border-sky-300 photo-strip-frame relative z-10">

        <!-- สติกเกอร์ตกแต่งที่กรอบ -->
        <div class="absolute -top-6 -right-5 text-6xl rotate-12 z-20 drop-shadow-lg">✨</div>
        <div class="absolute -bottom-5 -left-5 text-6xl -rotate-12 z-20 drop-shadow-lg">🦋</div>

        <!-- ส่วนหัว -->
        <div
            class="bg-gradient-to-r from-sky-400 to-blue-500 p-6 text-center text-white relative overflow-hidden border-b-[6px] border-sky-300 rounded-t-[34px]">
            <div class="absolute inset-0 opacity-20"
                style="background-image: radial-gradient(white 2px, transparent 2px); background-size: 20px 20px;">
            </div>
            <h1
                class="text-4xl font-extrabold flex items-center justify-center gap-3 relative z-10 drop-shadow-[0_4px_0_rgba(2,132,199,0.5)]">
                <i data-lucide="camera" class="w-10 h-10 text-yellow-300 fill-yellow-300"></i>
                Photo Booth
            </h1>
            <p class="text-lg opacity-100 mt-2 relative z-10 font-bold text-sky-100 tracking-wide drop-shadow-sm">ถ่าย
                4 ช็อตสุดคิ้วท์! 💎</p>
        </div>

        <!-- พื้นที่แสดงผลหลัก -->
        <div class="p-6 bg-white rounded-b-[34px]">

            <!-- กรอบแสดงกล้อง / รูปที่ถ่าย -->
            <div
                class="relative bg-sky-50 rounded-[30px] overflow-hidden aspect-[3/4] flex items-center justify-center shadow-[inset_0_0_20px_rgba(56,189,248,0.4)] border-[6px] border-sky-300">

                <!-- วิดีโอสด (กล้อง) -->
                <video id="videoElement" class="w-full h-full object-cover mirror hidden rounded-[24px]" autoplay
                    playsinline></video>

                <!-- รูปภาพผลลัพธ์ (Canvas) - ซ่อนไว้ ใช้สำหรับประมวลผล -->
                <canvas id="canvasElement" class="hidden"></canvas>

                <!-- รูปภาพผลลัพธ์สุดท้ายที่จะแสดง (Image) -->
                <img id="resultImage" class="w-full h-full object-contain hidden rounded-[24px]" alt="Photo Strip">

                <!-- ข้อความสถานะเริ่มต้น -->
                <div id="placeholderText" class="text-sky-400 flex flex-col items-center text-center p-4 z-10">
                    <div class="bg-white p-6 rounded-full mb-4 animate-bounce border-4 border-sky-300 shadow-lg">
                        <i data-lucide="heart" class="w-16 h-16 text-sky-500 fill-sky-500"></i>
                    </div>
                    <span class="text-2xl font-bold text-sky-500 drop-shadow-sm">พร้อมแล้วกด...</span>
                    <span class="text-lg text-sky-400 mt-1 font-semibold">"เปิดกล้อง" เลย! ✨</span>
                </div>

                <!-- ตัวเลขนับถอยหลัง -->
                <div id="countdownText"
                    class="absolute inset-0 flex items-center justify-center text-9xl font-extrabold text-white drop-shadow-[0_8px_0_rgba(14,165,233,1)] hidden animate-ping"
                    style="-webkit-text-stroke: 4px #0ea5e9;">
                    3
                </div>

                <!-- สถานะการถ่าย (เช่น 1/4) -->
                <div id="shotStatus"
                    class="absolute top-4 right-4 bg-sky-500 text-white px-3 py-1 rounded-full font-bold text-sm shadow-md hidden">
                    <span id="currentShot">1</span> / 4
                </div>

                <!-- เอฟเฟกต์แฟลช -->
                <div id="flashOverlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none"></div>
            </div>

            <!-- พื้นที่แสดงรูปย่อ 4 รูป -->
            <div id="thumbnailsContainer" class="hidden mt-4 grid grid-cols-4 gap-2">
                <!-- Thumbnails จะถูกเพิ่มที่นี่ด้วย JavaScript -->
            </div>

            <!-- ข้อความแจ้งเตือน (กรณีเกิดข้อผิดพลาด) -->
            <div id="errorMessage"
                class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-xl text-sm text-center border border-red-200">
            </div>

            <!-- ปุ่มควบคุมต่างๆ -->
            <div class="mt-6 flex flex-col gap-3">

                <!-- ปุ่มเปิดกล้อง -->
                <button id="btnStartCamera"
                    class="cute-btn flex items-center justify-center gap-2 bg-gradient-to-r from-sky-400 to-blue-400 text-white px-6 py-4 rounded-full font-bold text-2xl transition-all border-4 border-sky-300">
                    <i data-lucide="camera" class="w-8 h-8 fill-white"></i> เปิดกล้องโลด! 🪄
                </button>

                <div class="flex gap-3">
                    <!-- ปุ่มกดถ่ายรูป -->
                    <button id="btnCapture" style="box-shadow: 0 8px 0 #0284c7;"
                        class="hidden flex-1 items-center justify-center gap-2 bg-gradient-to-r from-sky-400 to-indigo-400 hover:from-sky-500 hover:to-indigo-500 text-white px-6 py-4 rounded-full font-bold text-xl transition-all hover:translate-y-1 hover:shadow-[0_4px_0_#0284c7] active:shadow-none active:translate-y-2 border-4 border-sky-200 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i data-lucide="sparkles" class="w-7 h-7"></i> ถ่ายเลย! (4 ช็อต)
                    </button>
                </div>

                <div class="flex gap-3">
                    <!-- ปุ่มถ่ายใหม่ (โชว์หลังถ่ายเสร็จ) -->
                    <button id="btnRetake" style="box-shadow: 0 8px 0 #4f46e5;"
                        class="hidden flex-1 items-center justify-center gap-2 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-4 rounded-full font-bold text-lg transition-all border-4 border-indigo-300 hover:translate-y-1 hover:shadow-[0_4px_0_#4f46e5] active:shadow-none active:translate-y-2">
                        <i data-lucide="rotate-ccw" class="w-6 h-6"></i> ถ่ายใหม่
                    </button>

                    <!-- ปุ่มดาวน์โหลด (โชว์หลังถ่ายเสร็จ) -->
                    <button id="btnDownload" style="box-shadow: 0 8px 0 #059669;"
                        class="hidden flex-1 items-center justify-center gap-2 bg-teal-400 hover:bg-teal-500 text-white px-3 py-4 rounded-full font-bold text-lg transition-all border-4 border-teal-200 hover:translate-y-1 hover:shadow-[0_4px_0_#059669] active:shadow-none active:translate-y-2">
                        <i data-lucide="download" class="w-6 h-6"></i> บันทึกรูป
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        // เริ่มต้นการใช้งานไอคอน Lucide
        lucide.createIcons();

        // อ้างอิงองค์ประกอบต่างๆ บนหน้าเว็บ
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const resultImage = document.getElementById('resultImage');
        const placeholderText = document.getElementById('placeholderText');
        const countdownText = document.getElementById('countdownText');
        const flashOverlay = document.getElementById('flashOverlay');
        const errorMessage = document.getElementById('errorMessage');
        const shotStatus = document.getElementById('shotStatus');
        const currentShotSpan = document.getElementById('currentShot');
        const thumbnailsContainer = document.getElementById('thumbnailsContainer');

        // ปุ่มต่างๆ
        const btnStartCamera = document.getElementById('btnStartCamera');
        const btnCapture = document.getElementById('btnCapture');
        const btnRetake = document.getElementById('btnRetake');
        const btnDownload = document.getElementById('btnDownload');

        let mediaStream = null;
        let isCapturing = false;
        let capturedPhotos = []; // เก็บรูป 4 ช็อต
        const TOTAL_SHOTS = 4;
        const COUNTDOWN_SECONDS = 3;
        const TIME_BETWEEN_SHOTS = 1000; // เวลาพักระหว่างช็อต (ms)

        // ฟังก์ชัน: เปิดกล้อง
        async function startCamera() {
            try {
                // ขออนุญาตใช้กล้องหน้า ความละเอียดสูงขึ้น
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 1920 },
                        height: { ideal: 1440 }, // อัตราส่วน 4:3
                        aspectRatio: 4 / 3
                    }
                });
                video.srcObject = mediaStream;

                // จัดการ UI
                placeholderText.classList.add('hidden');
                video.classList.remove('hidden');
                resultImage.classList.add('hidden');
                errorMessage.classList.add('hidden');

                btnStartCamera.classList.add('hidden');
                btnCapture.classList.remove('hidden');
                btnRetake.classList.add('hidden');
                btnDownload.classList.add('hidden');

                // รีเซ็ตสถานะ
                capturedPhotos = [];
                clearThumbnails();
                shotStatus.classList.add('hidden');

            } catch (err) {
                console.error("Error accessing camera:", err);
                showError("ไม่สามารถเข้าถึงกล้องได้ กรุณาตรวจสอบการตั้งค่าการอนุญาตของเบราว์เซอร์");
            }
        }

        // ฟังก์ชัน: ปิดกล้อง
        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        // ฟังก์ชัน: เริ่มกระบวนการถ่าย 4 ช็อต
        async function startCaptureProcess() {
            if (isCapturing) return;
            isCapturing = true;
            btnCapture.disabled = true;
            capturedPhotos = [];
            clearThumbnails();
            thumbnailsContainer.classList.remove('hidden');
            shotStatus.classList.remove('hidden');

            for (let i = 1; i <= TOTAL_SHOTS; i++) {
                currentShotSpan.textContent = i;
                await countdownAndCapture(i);
                if (i < TOTAL_SHOTS) {
                    // รอสักครู่ก่อนเริ่มนับถอยหลังช็อตถัดไป
                    await new Promise(resolve => setTimeout(resolve, TIME_BETWEEN_SHOTS));
                }
            }

            // ถ่ายครบ 4 รูปแล้ว
            isCapturing = false;
            btnCapture.disabled = false;
            shotStatus.classList.add('hidden');
            combinePhotosAndShowResult();
        }

        // ฟังก์ชัน: นับถอยหลังและถ่าย 1 รูป
        function countdownAndCapture(shotNumber) {
            return new Promise((resolve) => {
                let count = COUNTDOWN_SECONDS;
                countdownText.textContent = count;
                countdownText.classList.remove('hidden');

                const countdownInterval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownText.textContent = count;
                    } else {
                        clearInterval(countdownInterval);
                        countdownText.classList.add('hidden');
                        takeSinglePhoto(shotNumber);
                        resolve(); // เสร็จสิ้นการถ่ายช็อตนี้
                    }
                }, 1000);
            });
        }

        // ฟังก์ชัน: ถ่ายรูปเดี่ยว 1 รูป
        function takeSinglePhoto(shotNumber) {
            // เล่นเอฟเฟกต์แฟลช
            flashOverlay.classList.add('flash-active');
            setTimeout(() => flashOverlay.classList.remove('flash-active'), 500);

            const ctx = canvas.getContext('2d');
            // ตั้งขนาด canvas เท่ากับความละเอียดวิดีโอจริง
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // วาดภาพจากวิดีโอ (กลับด้านเหมือนกระจก)
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            // บันทึกรูปเป็น Data URL เก็บไว้
            const photoDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            capturedPhotos.push(photoDataUrl);

            // สร้างและแสดง thumbnail
            addThumbnail(photoDataUrl, shotNumber);
        }

        // ฟังก์ชัน: เพิ่ม thumbnail
        function addThumbnail(dataUrl, number) {
            const thumb = document.createElement('div');
            thumb.className = 'relative rounded-xl overflow-hidden aspect-[4/3] border-[3px] border-sky-400 shadow-[0_4px_0_#38bdf8] bg-white';
            const img = document.createElement('img');
            img.src = dataUrl;
            img.className = 'w-full h-full object-cover';
            thumb.appendChild(img);

            // เพิ่มตัวเลขบน thumbnail
            const numTag = document.createElement('div');
            numTag.className = 'absolute bottom-1 right-1 bg-sky-500 text-white text-xs font-bold px-2 py-0.5 rounded-full border-2 border-white shadow-sm';
            numTag.textContent = number;
            thumb.appendChild(numTag);

            thumbnailsContainer.appendChild(thumb);
        }

        // ฟังก์ชัน: ล้าง thumbnails
        function clearThumbnails() {
            thumbnailsContainer.innerHTML = '';
            thumbnailsContainer.classList.add('hidden');
        }

        // ฟังก์ชัน: รวม 4 รูปเป็น Photo Strip
        function combinePhotosAndShowResult() {
            const ctx = canvas.getContext('2d');

            // กำหนดขนาดของ Photo Strip (แนวตั้ง)
            const photoWidth = video.videoWidth;
            const photoHeight = video.videoHeight;
            const paddingX = 60; // ขอบแนวนอน
            const paddingY = 60; // ขอบแนวตั้ง
            const gapY = 40;     // ช่องว่างระหว่างรูป
            const bottomTextHeight = 150; // พื้นที่สำหรับข้อความด้านล่าง

            const stripWidth = photoWidth + (paddingX * 2);
            const stripHeight = (photoHeight * TOTAL_SHOTS) + (gapY * (TOTAL_SHOTS - 1)) + (paddingY * 2) + bottomTextHeight;

            canvas.width = stripWidth;
            canvas.height = stripHeight;

            // 1. วาดพื้นหลัง (สีกระดาษการ์ตูนๆ)
            ctx.fillStyle = '#e0f2fe';
            ctx.fillRect(0, 0, stripWidth, stripHeight);

            // วาดลายเส้นขอบนอกแบบหนาๆ
            ctx.lineWidth = 15;
            ctx.strokeStyle = '#38bdf8'; // สีฟ้าขอบ
            ctx.strokeRect(7, 7, stripWidth - 14, stripHeight - 14);

            // วาดลายจุดวงกลมเต็มแผ่น
            ctx.fillStyle = '#bae6fd';
            for (let i = 0; i < stripWidth; i += 50) {
                for (let j = 0; j < stripHeight; j += 50) {
                    ctx.beginPath();
                    ctx.arc(i, j, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 2. วาดรูปทั้ง 4 รูป
            capturedPhotos.forEach((photoDataUrl, index) => {
                const img = new Image();
                img.onload = () => {
                    const yPos = paddingY + index * (photoHeight + gapY);

                    // วาดเงาของรูป (เป็นสีเข้ม ไม่ใช่โปร่งใส เพื่อให้ดูการ์ตูน)
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(paddingX + 20, yPos + 20, photoWidth, photoHeight);

                    // วาดกรอบสีขาวรอบรูป
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(paddingX - 15, yPos - 15, photoWidth + 30, photoHeight + 30);

                    // เส้นขอบดำ หรือฟ้าเข้ม รอบรูป
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = '#0284c7';
                    ctx.strokeRect(paddingX - 15, yPos - 15, photoWidth + 30, photoHeight + 30);

                    // วาดรูป
                    ctx.drawImage(img, paddingX, yPos, photoWidth, photoHeight);

                    // วาดเทปสีน่ารักๆ แปะมุม
                    ctx.save();
                    ctx.fillStyle = '#fde047'; // เทปเหลือง
                    ctx.translate(paddingX - 10, yPos - 10);
                    ctx.rotate(-15 * Math.PI / 180);
                    ctx.fillRect(-40, -15, 80, 30);
                    ctx.restore();

                    ctx.save();
                    ctx.fillStyle = '#fb7185'; // เทปชมพู
                    ctx.translate(paddingX + photoWidth + 10, yPos - 10);
                    ctx.rotate(15 * Math.PI / 180);
                    ctx.fillRect(-40, -15, 80, 30);
                    ctx.restore();

                    // เมื่อวาดรูปสุดท้ายเสร็จ ให้ใส่ข้อความและแสดงผล
                    if (index === TOTAL_SHOTS - 1) {
                        // 3. ใส่ข้อความด้านล่าง
                        ctx.fillStyle = '#0369a1'; // สีฟ้าเข้ม
                        ctx.font = 'bold 80px "Mali", cursive, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText("Cute Girls 💎", stripWidth / 2, stripHeight - bottomTextHeight + 70);

                        ctx.font = 'bold 45px "Mali", cursive, sans-serif';
                        ctx.fillStyle = '#0284c7';
                        const dateStr = new Date().toLocaleDateString('th-TH', { year: '2-digit', month: 'short', day: 'numeric' });
                        ctx.fillText(dateStr + " ✨", stripWidth / 2, stripHeight - 20);

                        // แสดงผลลัพธ์
                        resultImage.src = canvas.toDataURL('image/png');
                        video.classList.add('hidden');
                        resultImage.classList.remove('hidden');
                        thumbnailsContainer.classList.add('hidden'); // ซ่อน thumbnails เมื่อแสดงผลลัพธ์รวม

                        btnCapture.classList.add('hidden');
                        btnRetake.classList.remove('hidden');
                        btnDownload.classList.remove('hidden');
                    }
                };
                img.src = photoDataUrl;
            });
        }

        // ฟังก์ชัน: ดาวน์โหลดรูปภาพ
        function downloadPhoto() {
            const link = document.createElement('a');
            const timestamp = new Date().getTime();
            link.download = `photobooth-strip-${timestamp}.png`;
            link.href = canvas.toDataURL('image/png', 1.0); // บันทึกเป็น PNG คุณภาพสูงสุด
            link.click();
        }

        // ฟังก์ชัน: แสดงข้อความ Error
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
        }

        // ผูก Event Listener กับปุ่มต่างๆ
        btnStartCamera.addEventListener('click', startCamera);
        btnCapture.addEventListener('click', startCaptureProcess);
        btnDownload.addEventListener('click', downloadPhoto);

        btnRetake.addEventListener('click', () => {
            // กลับไปหน้ากล้อง
            resultImage.classList.add('hidden');
            video.classList.remove('hidden');
            clearThumbnails();

            btnRetake.classList.add('hidden');
            btnDownload.classList.add('hidden');
            btnCapture.classList.remove('hidden');
        });

        // ปิดกล้องอัตโนมัติเมื่อผู้ใช้ปิดหน้าเว็บ
        window.addEventListener('beforeunload', stopCamera);

    </script>
</body>


</html>
